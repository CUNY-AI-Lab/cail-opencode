name: opencode-latest

# Early warning for OpenCode releases that break the plugin: runs the smoke test
# against the newest OpenCode 2.x release every day. A failure is a release task;
# see AGENTS.md.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode:
    name: newest OpenCode / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run test:opencode
        env:
          OPENCODE_VERSION: latest
          GITHUB_TOKEN: ${{ github.token }}
