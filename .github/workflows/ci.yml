name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test test/unit
      - run: bun run build
      - name: Published files
        run: npm pack --dry-run

  opencode:
    # The packed plugin in the pinned OpenCode release (opencode.tested in
    # package.json), against the mock gateway. No secrets are used.
    name: OpenCode / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run test:opencode

  publish:
    # Publishes to npm when a v* tag is pushed, after the unit and OpenCode jobs
    # pass. Authenticates through npm trusted publishing (OIDC): no npm token is
    # stored here. The trusted publisher on npmjs.com names this file, ci.yml.
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, opencode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --loglevel verbose
